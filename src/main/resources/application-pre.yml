#配置文件参考local
server:
  port: 8080
  tomcat:
    max-threads: 1000
    min-spare-threads: 30
  servlet:
    context-path: /

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  #应用名称
  application:
    # 与license 进行对应  临时license是cuddemo
    name: cuddemo
  servlet:
    multipart:
      max-file-size: 100MB  #上传文件设置 单个文件大小100M
      max-request-size: 100MB  #总上传的数据大小100M
    #多语言配置目录
  messages:
    basename: i18n/messages,i18n/system
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    #轻量级授权时，type为redis
  cache:
    type: redis
    #解决springboot2的bean重复扫描报错
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  #redis配置
  redis:
    database: 0
    host: aep-redis1-p.gnpjvc.cgnpc.com.cn
    #    host: 127.0.0.1
    port: 6379
    #    password:
    password: sm4(127xxxxxxxxxxxxkKvcsfBe1SuNT)
    jedis:
      pool:
        max-active: 800
        max-wait: 10000
        max-idle: 20
        min-idle: 2
        timeout: 30000
  thymeleaf:
    #prefix: /WEB-INF/templates/
    suffix: .html
    mode: HTML5
  #数据源配置
  datasource:
    druid:
      type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://10.100.xxx.xxx:3306/axxd4?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&autoReconnect=true&failOverReadOnly=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai
      username: aexxxxxer
      password: sm4(1167xxxxxxxxxxxxxxptbWBp3P9l8akw=)
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
        config:
          enabled: true
          #druid公钥  config.decrypt=false 表示不使用druid加密
          key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKms1ctmezXkUd7vQ5BhVkuFr0xQM032o323URadBOpKyWxPIDek/kcEEsryferiIqHOTSR2tNinmSIuwLNrVXkCAwEAAQ==
      connection-properties: config.decrypt=false;config.decrypt.key=${spring.datasource.druid.filter.config.key}
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*

  quartz:
    autoStartup: false
    #相关属性配置
    properties:
      org:
        quartz:
          scheduler:
            instanceName: clusteredScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 10000
            useProperties: false

          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
    #数据库方式
    job-store-type: jdbc

#mybatis classpath*读取子包中的xml文件
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml,classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔com.cgnpc.cud.auth.domain
  typeAliasesPackage: com.cgnpc.cuddemo.project.*.domain,com.cgnpc.cud.*.domain,com.cgnpc.cud.framework.domain,com.cgnpc.cud.authr.core.systemManage.*.domain
  type-enums-package: com.cgnpc.cuddemo.project.*.domain.enums
  global-config:
    db-config:
      table-prefix: ims.
      #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
      id-type: uuid
      #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
      field-strategy: not_empty
      #逻辑删除
  #      logic-delete-value: 0
  #      logic-not-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    database-id: mysql
  form-meta-object:
    type: defaul
#框架配置
cud:
  datasource:
    enable-multiple-source: true
    names: druid
    master-data-source-name: druid
  #登陆模式  三种模式：aep 域帐号单点登陆 / auth2 4A登录 /pro 解耦版本授权系统登录
  login-mode: auth2
  #单点登录配置
  sso:
    #系统后端地址，注意协议 http还是https，下同
    client: https://cuddemo4-p/server-api
    #单点登录地址
    server: http://aepsso.gnpjvc.cgnpc.com.cn/cas
    #系统前端地址
    vue: https://cuddemo4-p
    #排除单点登录配置
    exclude: /login/cas,/login/getUserDetail,/api/**,/api/login/**
    #单点登录多前端配置
    vue-list: {a: "http://localhost:8010",b: "http://localhost:9090",c: "http://localhost:8011"}
  oauth2:
    #4A申请应用ID
    client-id: CIT-CUD-DEV
    #4A申请应用密钥
    client-secret: CIT-CUD-dev@2021
    #应用前端首页
    vue: https://cuddemo4-p
    #应用后端地址
    server-url: https://cuddemo4-p/server-api
    #中台4A获取token地址
    access-token-url: https://aepgw-p.gnpjvc.cgnpc.com.cn/authcenter/getOauth2Token
    #中台4A获取用户信息地址
    user-info-url: https://aepgw-p.gnpjvc.cgnpc.com.cn/authcenter/getOauth2UserInfo
    #中台4A退出地址
    logout-url: https://aepgw-p.gnpjvc.cgnpc.com.cn/authcenter/userLogout
    #4A授权码获取地址
    authorize-url: https://uap-p.cgnpc.com.cn/authcenter/getOauth2Authorize
    #排除4A登录配置,默认可以删除
    exclude: /ws/**,/api/**,/api/login/**
  #dict数据字典配置
  dict:
    uri:
      queryBySuperId: /dict/queryDictClassifyBySupDictId
      queryDictItem: /dict/queryDictItem
  #PSC2.0相关配置
  psc2:
    # 后台服务地址
    servicePath: https://cuddemo4-p.gnpjvc.cgnpc.com.cn/server-api/
    #应用编码
    appcode: CUD
    #租户ID
    tenantId: tenCode
    #应用编码，,命名规则为appCode_tenantId_queue
    rollbackQueue: CUD_tenCode_queue
    #psc请求地址
    ascUrl: ttp://psc2-t.gnpjvc.cgnpc.com.cn/psc-oauth
    #psc请求地址
    pscUrl: http://psc2-t.gnpjvc.cgnpc.com.cn/psc-process
    #psc请求地址
    uauUrl: http://psc2-t.gnpjvc.cgnpc.com.cn/psc-system
    #授权Key
    appKey: xxxxxx
    #授权密钥
    appSecret: xxxxxx
    #授权类型
    grant_type: client_credentials
    #防篡改拦截
    tamperingInclude: /assembly/prepareSubmit
    #流程数据模型类路径
    dataModelClassPath: com.cgnpc.extend.datamodel.model.
  #UBA配置
  uba:
    #配置项中有此值，则开启UBA，否则不开启
    url: http://ubaservice-t.gnpjvc.cgnpc.com.cn
    #在 uba上注册的系统编码，如果不配置则以spring.application.name为准
    syscode: xxxxx
  #集团统一授权配置  记得申请统一授权微服务
  uau:
    # url是调用微服务的地址  -t 表示测试环境  -p表示预生产环境   http://aepgw 为正式环境
    url: http://aepgw-p.gnpjvc.cgnpc.com.cn/uauauth
    # name 表示 你在uau系统上注册的系统编码
    name: cxxxxx

  #代码生成器
  generator:
    author: pxmwlin
    #MVC 或者VUE
    mode: VUE
    #oracle专用
    schemaName: IMS
    #模块名称
    moduleName: module
    packageName: com.cgnpc.cuddemo
  lic:
    #license文件地址
    license: license.lic
  security:
    #安全相关过滤器
    filters:
      csrf:
        allowHeaders: authorization,Authorization,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,token
        allowOrigins: https://cuddemo4-p/server-api,https://cuddemo4-p
      file:
        excludes: /login,/logout
        #允许上传的文件扩展名
        extensions: png,jpg,jpeg,doc,docx,xls,xlsx,pdf,apk,zip
        #文件扩展名黑名单
        blockExtensions: sh,js,cmd,bat
        #上传文件最大限制单位M
        maxSize: 100
      xss:
        excludes: /login,/getUserList,/test/testFilter,/assembly/procValidateUpdate,/form/addForm,/form/updateFormNotUpVer,/form/updateFormUpVer,/assembly/prepareSubmit,/businessForm/save,/flowDesigner/updateProcModel,/flowDesigner/updateProcModelConfig,/wf/WfConfigManage/publishWFConfigActNode,/ruleEngine/execRuleExpr,/ruleEngine/wfRuleExprInspect,/cudWfRuleMaster/updateOne,/ruleEngine/wfRuleTreeInspect,/cudWfRuleMaster/addOne,/client/request/detail/format/xmlToJsonBySoap,/client/connection/v4/untitled/request,/client/connection/v4/Connector/getVerificationParameters,/client/request/detail/insert/RequestDetail,/ruleEngine/formRuleRecombination,/form/getFormById,/emailTemplate/update,/emailTemplate/add,/wf/WfConfigManage/saveDraftWFConfigActNode,/formHis/updateFormHisNotUpVer
      xxe:
        attributes: SYSTEM
        excludes: /login,/logout
      #审计日志过滤拦截，以英文逗号分隔
      audit:
        excludes: /monitor/ind/collect
    interceptors:
      #sql注入拦截器
      sqlInjection:
        #sql注入需要过滤的属性
        attributes: declare,alter,create,drop,1=1,database,1='1
        #是否大小写敏感
        caseSensitive: true
        #不需要注入拦截的方法：mapper + method
        excludes: com.cgnpc.cud.gen.dao.mapper.CudFormTmplTMapper.insert,com.cgnpc.cud.gen.dao.mapper.CudFormTmplTMapper.update
    #部署模式：war or jar
    deployMode: war
    #此处需要项目自行修改appid，与spring.application.name一致
    #license: appid=cuddemo&cudVersionNo=2.0
    #配置服务地址
    #serviceUri: /cudconfig/queryCudConfig
    #安全配置版本号
    versionNo: 1

