  operate-log:
    # 配置每个路径对应的模块名称
    module-name-config:
      - module-path-pattern: /v1/tenant/**
        module-name: 园区管理
        children-action-type:
          # child-path pattern必须是module-path-pattern的子模式，否则不会生效。优先级最高。
          - child-path: /v1/tenant/page
            action-type: 园区分页列表
            method: POST
          - child-path: /v1/tenant/pageFullInfo
            action-type: 园区分页列表
            method: POST
      - module-path-pattern: /v1/park/space/**
        module-name: 空间管理
        # 配置子动作
        children-action-type:
          # child-path pattern必须是module-path-pattern的子模式，否则不会生效。优先级最高。
          - child-path: /v1/park/space/tree
            action-type: 空间树查询
            method: GET
    # 配置不同路径模式对应的actionType（动作）值
    action-type-config:
      - controller-method-name: add
        method: POST
        action-type: 新增
      - controller-method-name: addBatch
        method: POST
        action-type: 批量新增
      - controller-method-name: remove
        method: DELETE
        action-type: 删除
      - controller-method-name: removeBatch
        method: DELETE
        action-type: 批量删除
      - controller-method-name: edit
        method: PUT
        action-type: 修改
      - controller-method-name: editBatch
        method: PUT
        action-type: 批量修改
      - controller-method-name: disable
        method: PUT
        action-type: 禁用
      - controller-method-name: disableBatch
        method: PUT
        action-type: 批量禁用
      - controller-method-name: enable
        method: PUT
        action-type: 启用
      - controller-method-name: enableBatch
        method: PUT
        action-type: 批量启用
      - controller-method-name: page
        method: POST
        action-type: 分页查询
      - controller-method-name: list
        method: POST
        action-type: 列表查询
      - controller-method-name: detail
        method: GET
        action-type: 查询详情
      - controller-method-name: findTree
        method: POST
        action-type: 查询树
      - controller-method-name: findTreeList
        method: POST
        action-type: 查询树集合
